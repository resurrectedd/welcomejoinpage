<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#030303">
<title>AED</title>
<style>
:root{--bg:#030303;--fg:#f2f2f2;--muted:#777}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
body{isolation:isolate}
#field{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:.82}
.grain{position:fixed;inset:-50%;pointer-events:none;opacity:.055;z-index:3;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");animation:grain .22s steps(2) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(1%,-1%)}50%{transform:translate(-1%,1%)}75%{transform:translate(1%,1%)}100%{transform:translate(-1%,-1%)}}
.scan{position:fixed;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.018) 4px)}
.intro{position:fixed;inset:0;z-index:4;display:grid;place-items:center;background:#030303;transition:opacity 1s ease,visibility 1s}
.intro.out{opacity:0;visibility:hidden}
#vortex{position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity 1.2s ease}
#vortex.settled{opacity:.4}
.core{position:relative;z-index:1;width:min(86vw,560px);display:flex;flex-direction:column;align-items:center;gap:clamp(18px,3.2vh,32px)}
.logo-wrap{position:relative;width:min(62vw,42vh,420px);aspect-ratio:1}
.logo-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;mix-blend-mode:lighten;filter:grayscale(1) brightness(1.7) contrast(1.6);transition:opacity 1.1s ease}
.logo-wrap.on img{opacity:1}
.logo-wrap:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(3,3,3,.55) 0 1px,transparent 1px 3px);opacity:0;transition:opacity 1.1s ease}
.logo-wrap.on:after{opacity:.55}
.wordmark{display:flex;font:800 clamp(24px,5.4vw,46px)/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.32em;margin-right:-.32em;text-transform:uppercase;min-height:1em;white-space:pre}
.wordmark span{opacity:0;display:inline-block;transition:opacity .15s}
.wordmark span.v{opacity:1}
.wordmark span.s{opacity:.55}
.hero{position:fixed;inset:0;display:grid;place-items:center;padding:28px;text-align:center;opacity:0;transform:translateY(12px);transition:opacity 1.1s ease,transform 1.1s ease;z-index:1}
.hero.show{opacity:1;transform:translateY(0)}
.hero-inner{max-width:720px}
.kicker{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.24em;color:#8a8a8a;text-transform:uppercase}
h1{font-size:clamp(36px,7vw,82px);line-height:.98;letter-spacing:-.065em;margin:22px 0;font-weight:650}
h1 span{color:#777}
.sub{max-width:470px;margin:0 auto;color:#8a8a8a;line-height:1.7;font-size:14px}
.line{height:1px;width:70px;background:#777;margin:28px auto}
.hero:not(.show){pointer-events:none}
.btn{display:inline-flex;align-items:center;gap:12px;margin-top:32px;padding:15px 30px;border:1px solid #f2f2f2;background:#f2f2f2;color:#030303;font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .25s ease,color .25s ease,transform .25s ease}
.btn:hover,.btn:focus-visible{background:transparent;color:#f2f2f2;outline:none}
.btn:active{transform:scale(.97)}
.btn i{font-style:normal;transition:transform .25s ease}
.btn:hover i{transform:translateX(4px)}
@media(max-width:600px){.logo-wrap{width:min(72vw,40vh,330px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<div class="scan" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
<section class="intro" id="intro" aria-label="Intro animation">
  <canvas id="vortex" aria-hidden="true"></canvas>
  <div class="core">
    <div class="logo-wrap" id="logo"><img id="logoImg" src="./logo.png" alt="Brand logo"></div>
    <div class="wordmark" id="wordmark" aria-label="Anti Edge Decay"></div>
  </div>
</section>
<main class="hero" id="hero">
  <div class="hero-inner">
    <div class="kicker">Precision · Process · Discipline</div>
    <h1>See the market<br><span>differently.</span></h1>
    <div class="line"></div>
    <p class="sub">A focused space for research, execution, and sharper decisions. No noise. Just the work.</p>
    <a class="btn" id="cta" href="#"><span>Join Now</span><i>&rarr;</i></a>
  </div>
</main>
<script>
(() => {
 // ===================== CONFIG =====================
 const LINK_URL='https://discord.gg/your-invite';  // <- where the button sends people
 const TRACK_ENDPOINT='';                           // <- your Cloudflare Worker URL (see worker/README.txt). Empty = tracking off.
 const RESPECT_DNT=true;                            // skip tracking for browsers that send "Do Not Track"

 // ===================== TRACKING =====================
 // The page only talks to YOUR relay (TRACK_ENDPOINT). The Discord webhook lives
 // on the relay as a secret, so it never appears in this file or the Network tab.
 const sid=(()=>{try{let v=sessionStorage.getItem('sid');if(!v){v=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now()).slice(0,13);sessionStorage.setItem('sid',v)}return v}catch(e){return 'na'}})();
 const tStart=Date.now();
 const trackOn=!!TRACK_ENDPOINT&&!(RESPECT_DNT&&navigator.doNotTrack==='1');
 function track(event,extra){
  if(!trackOn)return;
  try{
   const body=JSON.stringify(Object.assign({
    event,sid,path:location.pathname+location.hash,
    ref:document.referrer||'',lang:navigator.language||'',
    tz:(Intl.DateTimeFormat().resolvedOptions().timeZone)||'',
    scr:screen.width+'x'+screen.height,vp:innerWidth+'x'+innerHeight,
    dpr:devicePixelRatio||1,touch:navigator.maxTouchPoints>0,
    mem:navigator.deviceMemory||0,cores:navigator.hardwareConcurrency||0,
    net:(navigator.connection&&navigator.connection.effectiveType)||'',
    secs:Math.round((Date.now()-tStart)/1000)
   },extra||{}));
   // text/plain avoids a CORS preflight; sendBeacon survives page navigation
   if(!(navigator.sendBeacon&&navigator.sendBeacon(TRACK_ENDPOINT,new Blob([body],{type:'text/plain'}))))
    fetch(TRACK_ENDPOINT,{method:'POST',body,keepalive:true,mode:'no-cors'}).catch(()=>{});
  }catch(e){}
 }
 track('page_view');
 let left=false;
 addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&!left){left=true;track('left_site')}else if(document.visibilityState==='visible')left=false});

 // ===================== BUTTON =====================
 const cta=document.getElementById('cta');
 cta.href=LINK_URL;
 cta.addEventListener('click',()=>{track('button_click',{target:LINK_URL})}); // then the link redirects normally

 const canvas=document.getElementById('field'),ctx=canvas.getContext('2d');
 let w=0,h=0,dpr=1,pts=[];
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 function resize(){
  dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;
  canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const count=Math.min(170,Math.floor(w*h/7500));
  pts=Array.from({length:count},()=>({a:Math.random()*Math.PI*2,r:Math.random()*Math.max(w,h)*.65+20,s:.35+Math.random()*1.2,v:.0008+Math.random()*.002,alpha:.12+Math.random()*.42,phase:Math.random()*6.28}));
 }
 function draw(t){
  ctx.clearRect(0,0,w,h);
  const cx=w/2,cy=h/2;
  for(const p of pts){
   const a=p.a+t*p.v, r=p.r+Math.sin(t*.0007+p.phase)*12;
   const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r*.62;
   const dx=x-cx,dy=y-cy,dist=Math.hypot(dx,dy);
   const alpha=p.alpha*(.3+.7*(.5+.5*Math.sin(t*.001+p.phase)));
   ctx.fillStyle=`rgba(235,235,235,${alpha})`;
   ctx.fillRect(x,y,p.s,p.s);
   if(dist<Math.min(w,h)*.23 && Math.sin(a*3+t*.0008)>.96){
    ctx.strokeStyle=`rgba(210,210,210,${alpha*.18})`;ctx.lineWidth=.5;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx*.035,y+dy*.035);ctx.stroke();
   }
  }
  requestAnimationFrame(draw);
 }
 resize();addEventListener('resize',resize);requestAnimationFrame(draw);

 // ===================== INTRO =====================
 const BRAND='Anti Edge Decay';        // <- wordmark text
 const AUTO_HERO=true;            // false = hold on the logo, never show hero
 const HOLD_AFTER_DECODE=1500;    // ms to hold the finished logo before the hero
 const intro=document.getElementById('intro'),hero=document.getElementById('hero');
 const vc=document.getElementById('vortex'),vx=vc.getContext('2d');
 const logoEl=document.getElementById('logo'),logoImg=document.getElementById('logoImg'),wm=document.getElementById('wordmark');
 let done=false,vw=0,vh=0,vdpr=1,P=[],lcx=0,lcy=0,lw=1,lh=1,t0=0,sc=1,decodeStarted=false,logoShown=false;
 const rnd=Math.random,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
 const easeOut=x=>1-Math.pow(1-x,3),easeIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;

 const finish=(why)=>{if(done)return;done=true;track('intro_'+(why==='skip'?'skipped':'finished'));intro.classList.add('out');hero.classList.add('show');setTimeout(()=>{vx.clearRect(0,0,vw,vh)},1100)};
 document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='Escape')finish('skip')});
 intro.addEventListener('click',()=>finish('skip'));

 // wordmark scramble-decode
 const GL='01#/\\<>&%$@+*';
 const chars=[...BRAND].map(c=>{const s=document.createElement('span');s.textContent=c;wm.appendChild(s);return s});
 function decode(){
  const t=performance.now();
  chars.forEach((s,i)=>{
   const ch=BRAND[i];if(ch===' '){s.classList.add('v');return}
   const begin=t+i*60,end=t+520+i*105;
   const iv=setInterval(()=>{
    const n=performance.now();
    if(n<begin)return;
    if(n>=end){s.textContent=ch;s.className='v';clearInterval(iv);return}
    s.textContent=GL[(rnd()*GL.length)|0];s.className='s';
   },45);
  });
  if(AUTO_HERO)setTimeout(()=>finish('auto'),520+BRAND.length*105+HOLD_AFTER_DECODE);
 }

 // sample particle targets from the logo image
 function sample(){
  const S=384,oc=document.createElement('canvas');oc.width=oc.height=S;
  const o=oc.getContext('2d',{willReadFrequently:true});
  o.drawImage(sampleImg,0,0,S,S);
  const d=o.getImageData(0,0,S,S).data,pool=[];
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
   const i=(y*S+x)*4,l=(d[i]+d[i+1]+d[i+2])/3;
   if(l>55)pool.push(x,y,l);
  }
  const total=pool.length/3,N=Math.min(total,innerWidth<700?6500:12000);
  const cx=vw/2;
  for(let k=0;k<N;k++){ // partial Fisher-Yates
   const j=k+((rnd()*(total-k))|0);
   for(let q=0;q<3;q++){const a=pool[k*3+q];pool[k*3+q]=pool[j*3+q];pool[j*3+q]=a}
   const maxR=Math.hypot(vw,vh)*.6;
   const r0=Math.sqrt(rnd())*maxR+10;
   P.push({nx:pool[k*3]/S,ny:pool[k*3+1]/S,lum:pool[k*3+2]/255,
    r0,a0:rnd()*Math.PI*2,w:2.6/(1+r0/170)+.22,
    spawn:rnd()*1.0,start:.95+rnd()*1.05,dur:.9+rnd()*.6,
    s:1+rnd()*1.1,ba:.4+rnd()*.6,ph:rnd()*6.28,rt:0,at:0});
  }
  layout();
 }
 function layout(){
  const r=logoEl.getBoundingClientRect();
  lw=r.width;lh=r.height;lcx=r.left+lw/2;lcy=r.top+lh/2;sc=clamp(lw/400,.8,1.5);
  for(const p of P){const dx=(p.nx-.5)*lw,dy=(p.ny-.5)*lh;p.rt=Math.hypot(dx,dy);p.at=Math.atan2(dy,dx)}
 }
 function vresize(){
  vdpr=Math.min(devicePixelRatio||1,2);vw=innerWidth;vh=innerHeight;
  vc.width=vw*vdpr;vc.height=vh*vdpr;vx.setTransform(vdpr,0,0,vdpr,0,0);
  vx.fillStyle='#030303';vx.fillRect(0,0,vw,vh);
  if(P.length)layout();
 }
 function frame(now){
  if(done)return;
  const t=(now-t0)/1000;
  // trail fade (shorter trails once settled)
  vx.globalAlpha=t<2.2?.16:.45;vx.fillStyle='#030303';vx.fillRect(0,0,vw,vh);
  vx.fillStyle='#fff';
  const TAU=Math.PI*2;
  for(const p of P){
   const vis=clamp((t-p.spawn)*2.5,0,1);if(vis<=0)continue;
   const e=easeOut(clamp((t-p.start)/p.dur,0,1));
   let da=((p.a0-p.at+Math.PI)%TAU+TAU)%TAU-Math.PI;da+=p.w*t;
   const a=p.at+(1-e)*da,r=p.rt+(1-e)*(p.r0-p.rt);
   let x=lcx+Math.cos(a)*r,y=lcy+Math.sin(a)*r;
   if(e>=1){x+=Math.sin(t*5+p.ph)*.35;y+=Math.cos(t*4+p.ph)*.35}
   const al=vis*(p.ba*(1-e)+(.55+.45*p.lum)*e)*(e>=1?.8+.2*Math.sin(t*6+p.ph):1);
   vx.globalAlpha=al;
   const z=p.s*sc*(1-.25*e);
   vx.fillRect(x,y,z,z);
  }
  vx.globalAlpha=1;
  if(t>2.35&&!logoShown){logoShown=true;logoEl.classList.add('on');vc.classList.add('settled')}
  if(t>2.6&&!decodeStarted){decodeStarted=true;decode()}
  requestAnimationFrame(frame);
 }
 function startIntro(){
  vresize();
  if(reduce){
   logoEl.classList.add('on');chars.forEach((s,i)=>{s.textContent=BRAND[i];s.className='v'});
   setTimeout(()=>finish('auto'),AUTO_HERO?800:1e9);return;
  }
  sample();t0=performance.now();requestAnimationFrame(frame);
 }
 addEventListener('resize',vresize);
 // Small embedded copy of the logo used ONLY for sampling particle positions
 // (keeps the canvas untainted when opened straight from disk via file://).
 // If you change logo.png, regenerate this or serve the folder over http and use logoImg instead.
